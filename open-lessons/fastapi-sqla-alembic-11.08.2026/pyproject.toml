[project]
name = "fastapi-sqlalchemy-alembic-demo"
version = "0.1.0"
description = "FastAPI with synchronous SQLAlchemy, Alembic and PostgreSQL"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5,<2.0",
    "fastapi[standard]>=0.139.2,<1.0",
    "psycopg[binary]>=3.3.4,<4.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings[yaml]>=2.14.2,<3.0",
    "SQLAlchemy>=2.0.51,<2.1",
    "uvicorn[standard]>=0.51.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0,<3.0",
    "prek>=0.4.12,<1.0",
    "pyrefly>=1.2.0,<2.0",
    "pytest>=9.0.2,<10.0",
    "ruff>=0.16.2,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = ["app", "tests"]
python-version = "3.14"
preset = "strict"
search-path = ["."]

[tool.uv.build-backend]
module-name = "app"
module-root = ""
