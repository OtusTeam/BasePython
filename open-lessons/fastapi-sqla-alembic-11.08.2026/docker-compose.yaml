services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${FASTAPI_DEMO__DATABASE__POSTGRES__USER:-app}
      POSTGRES_PASSWORD: ${FASTAPI_DEMO__DATABASE__POSTGRES__PASSWORD:-app}
      POSTGRES_DB: ${FASTAPI_DEMO__DATABASE__POSTGRES__DATABASE:-app}
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - max_connections=${FASTAPI_DEMO__DATABASE__POSTGRES__MAX_CONNECTIONS:-100}
    ports:
      - "${FASTAPI_DEMO__DATABASE__POSTGRES__PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
