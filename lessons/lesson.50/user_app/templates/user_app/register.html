{% extends "blog_app/base.html" %}

{% block titlet %}Регистрация{% endblock %}


{% block content %}
    <h1>Вход в личный кабинет</h1>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary nt-3">Зарегистрироваться</button>
    </form>
    <p class="mt-3">
        Уже есть аккаунт? <a href="{% url 'login' %}" class="btn btn-secondary mt-3">Войти</a>
    </p>
{% endblock %}
