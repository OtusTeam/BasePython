{% extends 'base.html' %}

{% block title %} {{ title }} {% endblock %}

{% block content %}
    <h1> {{ title }}</h1>

        <h5>{{ movie.title }}</h5>
        <p>{{ movie.description }}</p>
        <p>{{ movie.year }}</p>
        {% if movie.year > 2010 %}
            <p>Новый фильм</p>
        {% else %}
            <p>Старый фильм</p>
        {% endif %}
        <br>
        <hr>


{% endblock %}
