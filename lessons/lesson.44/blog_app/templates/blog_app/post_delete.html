{% extends 'blog_app/base.html' %}

{% block title %}
    Удаление поста
{% endblock %}

{% block content %}
    <h1>Вы уверены, что хотите удалить пост?</h1>
    <h3>{{ object.title }}</h3>
    <p>{{ object.content }}</p>
    <form method="post" class="mt-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger nt-3">Удалить</button>
        <a href="{% url 'post_list' %}" class="btn btn-secondary nt-2">Отмена</a>
    </form>


{% endblock %}
