{% extends 'base.html' %}

{% block title %}
    {{ movie.title }}
{% endblock %}

{% block head %}By!{% endblock %}

{% block content %}
    <h3>{{ movie.title }}</h3>
    <p><i>{{ movie.description }}</i></p>
    <p><b>{{ movie.year }}</b></p>
    {% if movie.year >= 2000 %}
        <p>Новый фильм</p>
    {% else %}
        <p>Старый фильм</p>
    {% endif %}
        <hr>

{% endblock %}
